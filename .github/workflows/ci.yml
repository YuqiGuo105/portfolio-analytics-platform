name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build · Test · Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alerts_test
          POSTGRES_USER: alerts_test
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alerts_test -d alerts_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ALERT_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/alerts_test
      ALERT_TEST_DB_USER: alerts_test
      ALERT_TEST_DB_PASSWORD: local-test-only
      ANALYTICS_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/analytics_test
      ANALYTICS_TEST_DB_USER: alerts_test
      ANALYTICS_TEST_DB_PASSWORD: local-test-only
    steps:
      - uses: actions/checkout@v4

      - name: Create isolated analytics security test database
        env:
          PGPASSWORD: local-test-only
        run: psql -h 127.0.0.1 -U alerts_test -d postgres -c 'CREATE DATABASE analytics_test'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test, enforce 60% line coverage
        run: mvn -B -ntp -Pcoverage verify

  docker:
    name: Build module images
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - analytics-aggregator-service
          - analytics-alerts-service
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.module }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.module }}/Dockerfile
          push: false
          tags: ${{ matrix.module }}:ci
